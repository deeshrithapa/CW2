<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduBridge International</title>
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <header class="header" id="site-header"></header>

    <!-- HERO CONTENT -->
    <section class="contact-hero">
      <div class="contact-hero-content">
        <p class="breadcrumb">
          <a href="../index.html">Home</a> ›
          <span>Universities</span>
        </p>
        <h1>Universities</h1>
        <p class="contact-subtext">
          Explore a wide range of universities from across the world and let us
          guide you reach to your dream university.
        </p>
      </div>
    </section>

    <!-- UNIVERSITIES SECTION -->
    <section class="universities-section">
      <div class="container">
        <h2 class="section-title">Explore Universities</h2>

        <!-- Country Filter — options are dynamically populated via JS -->
        <div class="filter-container">
          <label for="countryFilter">Filter by Country:</label>
          <select id="countryFilter">
            <option value="all">All Countries</option>
          </select>
        </div>

        <!-- Cards Container -->
        <div id="universities-container"></div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer" id="site-footer"></footer>

    <script src="../js/components.js"></script>
    <script src="../js/script.js"></script>

    <script>
      // ================== GET ELEMENTS ==================

      // Get container where university cards will be displayed
      const container = document.getElementById("universities-container");

      // Get dropdown filter
      const filter = document.getElementById("countryFilter");

      // Store all university data so filter can reuse it
      let universitiesData = [];

      // ================== FETCH DATA ==================

      fetch("http://localhost:3000/universities")
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          universitiesData = data;

          displayUniversities(data);

          populateFilter(data);
        })
        .catch(function (error) {
          console.error("Error:", error);
          alert("Failed to load universities");
        });

      // ================== DISPLAY UNIVERSITIES ==================

      function displayUniversities(data) {
        container.innerHTML = ""; // clear old cards

        // Loop through each university and create a card
        data.forEach(function (uni) {
          const card = document.createElement("div");
          card.classList.add("uni-card");

          // Add card content
          card.innerHTML = `
            <img src="${uni.image}" alt="${uni.name}" class="uni-img">
            <div class="uni-content">
              <h3 class="uni-name">${uni.name}</h3>
              <p class="uni-location">${uni.city}, ${uni.country}</p>
              <p class="uni-courses">
                <strong>Available Courses:</strong><br>
                ${uni.courses}
              </p>
              <p class="uni-desc">${uni.description}</p>
              <p class="uni-fee">
                <strong>Tuition:</strong> ${uni.tuition}
              </p>
              <div class="uni-buttons">
                <a href="${uni.website}" target="_blank" class="btn-outline">
                  Visit Website
                </a>
                <button class="btn-primary apply-btn" onclick="saveUniversity('${uni.name}')">
                  Save
                </button>
              </div>
            </div>
          `;

          // Add card to page
          container.appendChild(card);
        });
      }

      // ================== SAVE UNIVERSITY ==================

      function saveUniversity(name) {
        alert(name + " saved!");
      }

      // ================== POPULATE FILTER ==================

      function populateFilter(data) {
        const countries = [];

        // Collect unique countries manually
        data.forEach(function (uni) {
          if (!countries.includes(uni.country)) {
            countries.push(uni.country);
          }
        });

        // Add each country as an option in the dropdown
        countries.forEach(function (country) {
          const option = document.createElement("option");
          option.value = country;
          option.textContent = country;
          filter.appendChild(option);
        });
      }

      // ================== FILTER LOGIC ==================

      filter.addEventListener("change", function () {
        const selectedCountry = filter.value;

        // If "All Countries" selected, show everything
        if (selectedCountry === "all") {
          displayUniversities(universitiesData);
        } else {
          const filteredUniversities = [];

          // Manually filter universities by country
          universitiesData.forEach(function (uni) {
            if (uni.country === selectedCountry) {
              filteredUniversities.push(uni);
            }
          });

          displayUniversities(filteredUniversities);
        }
      });
    </script>
  </body>
</html>
