<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EduBridge International</title>
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- Navbar  -->
    <header class="header" id="site-header"></header>

    <!-- HERO CONTENT -->
    <section class="contact-hero">
      <div class="contact-hero-content">
        <p class="breadcrumb">
          <a href="../index.html">Home</a> ›
          <span>Universities</span>
        </p>

        <h1>Univerities</h1>
        <p class="contact-subtext">
          Explore a wide range of universities from across the world and let us
          guide you reach to your dream university.
        </p>
      </div>
    </section>

    <!-- UNIVERSITIES SECTION -->
    <section class="universities-section">
      <div class="container">
        <h2 class="section-title">Explore Universities</h2>

        <!--Country Filter where options are dynamically populated via JS -->
        <div class="filter-container">
          <label for="countryFilter">Filter by Country:</label>
          <select id="countryFilter">
            <option value="all">All Countries</option>
          </select>
        </div>

        <!-- Cards Container (REQUIRED) -->
        <div id="universities-container"></div>
      </div>
    </section>
    <!-- FOOTER -->
    <footer class="footer" id="site-footer"></footer>

    <script src="../js/universities.js"></script>
   <script src="../js/components.js"></script>
<script src="../js/script.js"></script>
  </body>
</html>
