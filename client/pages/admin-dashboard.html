<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="admin-page">
      <div class="admin-topbar">
        <h1 class="admin-title">Admin Dashboard</h1>
        <button class="admin-logout-btn" id="logoutBtn">Logout</button>
      </div>

      <div class="admin-links">
        <a href="manage-users.html" class="admin-link-btn">👤 Manage Users</a>
        <a href="manage-universities.html" class="admin-link-btn"
          >🏫 Manage Universities</a
        >
        <a href="view-enquiries.html" class="admin-link-btn"
          >📩 View Enquiries</a
        >
        <a href="view-consultations.html" class="admin-link-btn"
          >📅 View Consultations</a
        >
      </div>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user) window.location.href = "login.html";
      if (user.role !== "admin") window.location.href = "../index.html";

      document
        .getElementById("logoutBtn")
        .addEventListener("click", function () {
          localStorage.removeItem("user");
          window.location.href = "login.html";
        });
    </script>
  </body>
</html>
