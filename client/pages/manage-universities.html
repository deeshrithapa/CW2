<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Universities</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div class="admin-page">
      <div class="admin-topbar">
        <h1 class="admin-title">Manage Universities</h1>
        <a href="admin-dashboard.html" class="back-btn">← Back to Dashboard</a>
      </div>

      <!-- ================= FORM ================= -->

      <div class="admin-form">
        <input type="hidden" id="universityId" />
        <input type="text" id="name" placeholder="University Name" />
        <input type="text" id="country" placeholder="Country" />
        <input type="text" id="city" placeholder="City" />
        <input type="text" id="courses" placeholder="Courses" />
        <input type="text" id="tuition" placeholder="Tuition Fees" />
        <input type="text" id="image" placeholder="Image URL" />
        <input type="text" id="website" placeholder="Website URL" />
        <textarea
          id="description"
          placeholder="University Description"
        ></textarea>
        <button class="admin-btn" onclick="saveUniversity()">
          Save University
        </button>
      </div>

      <!-- ================= TABLE ================= -->

      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Country</th>
            <th>City</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="universitiesTableBody"></tbody>
      </table>
    </div>

    <script>
      // ================= LOAD UNIVERSITIES =================

      function loadUniversities() {
        fetch("http://localhost:3000/universities")
          .then(function (response) {
            return response.json();
          })
          .then(function (universities) {
            const tableBody = document.getElementById("universitiesTableBody");

            tableBody.innerHTML = "";

            universities.forEach(function (uni, index) {
              const row = document.createElement("tr");

              row.innerHTML = `
                <td>${index + 1}</td>
                <td>${uni.name}</td>
                <td>${uni.country}</td>
                <td>${uni.city}</td>
                <td>
                  <button class="edit-btn" onclick="editUniversity(${uni.id})">Edit</button>
                  <button class="delete-btn" onclick="deleteUniversity(${uni.id})">Delete</button>
                </td>
              `;

              tableBody.appendChild(row);
            });
          })
          .catch(function (error) {
            console.error("Error:", error);
            alert("Failed to load universities");
          });
      }

      // ================= SAVE UNIVERSITY (ADD OR UPDATE) =================

      function saveUniversity() {
        const universityId = document.getElementById("universityId").value;

        const universityData = {
          name: document.getElementById("name").value,
          country: document.getElementById("country").value,
          city: document.getElementById("city").value,
          courses: document.getElementById("courses").value,
          tuition: document.getElementById("tuition").value,
          image: document.getElementById("image").value,
          website: document.getElementById("website").value,
          description: document.getElementById("description").value,
        };

        // ================= UPDATE =================

        if (universityId) {
          fetch("http://localhost:3000/universities/" + universityId, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(universityData),
          })
            .then(function (response) {
              return response.json();
            })
            .then(function (data) {
              alert("University updated successfully");
              clearForm();
              loadUniversities();
            })
            .catch(function (error) {
              console.error("Error:", error);
              alert("Update failed");
            });

          // ================= ADD =================
        } else {
          fetch("http://localhost:3000/universities", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(universityData),
          })
            .then(function (response) {
              return response.json();
            })
            .then(function (data) {
              alert("University added successfully");
              clearForm();
              loadUniversities();
            })
            .catch(function (error) {
              console.error("Error:", error);
              alert("Add failed");
            });
        }
      }

      // ================= EDIT UNIVERSITY =================

      function editUniversity(id) {
        fetch("http://localhost:3000/universities")
          .then(function (response) {
            return response.json();
          })
          .then(function (universities) {
            const university = universities.find(function (uni) {
              return uni.id === id;
            });

            // Fill form with existing data
            document.getElementById("universityId").value = university.id;
            document.getElementById("name").value = university.name;
            document.getElementById("country").value = university.country;
            document.getElementById("city").value = university.city;
            document.getElementById("courses").value = university.courses;
            document.getElementById("tuition").value = university.tuition;
            document.getElementById("image").value = university.image;
            document.getElementById("website").value = university.website;
            document.getElementById("description").value =
              university.description;

            // Scroll to top so user can see the form
            window.scrollTo({ top: 0, behavior: "smooth" });
          })
          .catch(function (error) {
            console.error("Error:", error);
            alert("Failed to load university for editing");
          });
      }

      // ================= DELETE UNIVERSITY =================

      function deleteUniversity(id) {
        const confirmDelete = confirm(
          "Are you sure you want to delete this university?",
        );

        if (!confirmDelete) {
          return;
        }

        fetch("http://localhost:3000/universities/" + id, {
          method: "DELETE",
        })
          .then(function (response) {
            return response.json();
          })
          .then(function (data) {
            alert("University deleted successfully");
            loadUniversities();
          })
          .catch(function (error) {
            console.error("Error:", error);
            alert("Delete failed");
          });
      }

      // ================= CLEAR FORM =================

      function clearForm() {
        document.getElementById("universityId").value = "";
        document.getElementById("name").value = "";
        document.getElementById("country").value = "";
        document.getElementById("city").value = "";
        document.getElementById("courses").value = "";
        document.getElementById("tuition").value = "";
        document.getElementById("image").value = "";
        document.getElementById("website").value = "";
        document.getElementById("description").value = "";
      }

      // ================= INITIAL LOAD =================

      loadUniversities();
    </script>
  </body>
</html>
