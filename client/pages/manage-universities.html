<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Manage Universities</title>

    <link rel="stylesheet" href="../css/style.css" />

    <style>
      .admin-section {
        padding: 50px;
        background: #f6f6f8;
        min-height: 100vh;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .admin-title {
        color: #3a1f70;
      }

      .back-btn {
        background: #4b2d87;
        color: white;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 14px;
      }

      .back-btn:hover {
        background: #3a1f70;
      }

      .admin-form {
        background: white;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 40px;
      }

      .admin-form input,
      .admin-form textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-family: inherit;
      }

      .admin-btn {
        background: #4b2d87;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      .admin-btn:hover {
        background: #3a1f70;
      }

      table {
        width: 100%;
        background: white;
        border-collapse: collapse;
      }

      th {
        background: #4b2d87;
        color: white;
        padding: 14px;
      }

      td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
      }

      .edit-btn {
        background: #c8a94d;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 5px;
        cursor: pointer;
      }

      .edit-btn:hover {
        opacity: 0.9;
      }

      @media (max-width: 768px) {
        .admin-section {
          padding: 20px;
        }

        table {
          font-size: 12px;
        }

        th,
        td {
          padding: 8px;
        }

        .top-bar {
          flex-direction: column;
          gap: 15px;
          align-items: flex-start;
        }
      }
    </style>
  </head>

  <body>
    <section class="admin-section">
      <!-- TOP BAR -->

      <div class="top-bar">
        <h1 class="admin-title">Manage Universities</h1>

        <a href="admin-dashboard.html" class="back-btn">
          ← Back to Dashboard
        </a>
      </div>

      <!-- ADD UNIVERSITY FORM -->

      <div class="admin-form">
        <input type="hidden" id="universityId" />
        <input type="text" id="name" placeholder="University Name" />

        <input type="text" id="country" placeholder="Country" />

        <input type="text" id="city" placeholder="City" />

        <input type="text" id="courses" placeholder="Courses" />

        <input type="text" id="tuition" placeholder="Tuition Fees" />

        <input type="text" id="image" placeholder="Image URL" />

        <input type="text" id="website" placeholder="Website URL" />

        <textarea id="description" placeholder="University Description" ></textarea>

        <button class="admin-btn" id="saveUniversityBtn"> Save University  </button>
      </div>

      <!-- UNIVERSITIES TABLE -->

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Country</th>
            <th>City</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="universitiesTableBody"></tbody>
      </table>
    </section>

    <script src="../js/manage-universities.js"></script>
  </body>
</html>
