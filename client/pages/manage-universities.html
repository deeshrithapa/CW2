<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Universities</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div class="admin-page">
      <div class="admin-topbar">
        <h1 class="admin-title">Manage Universities</h1>
        <a href="admin-dashboard.html" class="back-btn">← Back to Dashboard</a>
      </div>

      <div class="admin-form">
        <input type="hidden" id="universityId" />
        <input type="text" id="name" placeholder="University Name" />
        <input type="text" id="country" placeholder="Country" />
        <input type="text" id="city" placeholder="City" />
        <input type="text" id="courses" placeholder="Courses" />
        <input type="text" id="tuition" placeholder="Tuition Fees" />
        <input type="text" id="image" placeholder="Image URL" />
        <input type="text" id="website" placeholder="Website URL" />
        <textarea
          id="description"
          placeholder="University Description"
        ></textarea>
        <button class="admin-btn" id="saveUniversityBtn">
          Save University
        </button>
      </div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Country</th>
            <th>City</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="universitiesTableBody"></tbody>
      </table>
    </div>

    <script src="../js/manage-universities.js"></script>
  </body>
</html>
